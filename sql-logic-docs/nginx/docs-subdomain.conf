# ════════════════════════════════════════════════════════════════════════
# Must Be The SQL — Docs site Nginx config (SUBDOMAIN mode: docs.example.com)
# ════════════════════════════════════════════════════════════════════════
# IMPORTANT: for this mode you MUST rebuild with baseUrl='/':
#
#   docusaurus.config.ts  →  baseUrl: '/'
#   then:  npm run build
#
# Otherwise you get the ugly double prefix: docs.example.com/docs/docs/...
# ════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.example.com;

    # ssl_certificate     /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;

    root /var/www/must-be-the-sql/docs-site/build;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    # SPA fallback — baseUrl is "/" so fallback is plain /index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets → immutable cache
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML → never cache aggressively
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ════════════════════════════════════════════════════════════════════════
# Deployment checklist (subdomain mode)
#   1. Edit docusaurus.config.ts → baseUrl: '/'
#   2. cd sql-logic-docs && npm ci && npm run build
#   3. rsync build/ → /var/www/must-be-the-sql/sql-logic-docs/build/
#   4. Configure DNS: docs.example.com → server IP
#   5. nginx -t && nginx -s reload
# ════════════════════════════════════════════════════════════════════════
