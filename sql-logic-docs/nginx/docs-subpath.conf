# ════════════════════════════════════════════════════════════════════════
# Must Be The SQL — Docs site Nginx config (SUBPATH mode: example.com/docs/)
# ════════════════════════════════════════════════════════════════════════
# Build context:  baseUrl='/docs/'  →  output dir: docs-site/build/
#
# Drop this file (or include it) into the server block that also serves the
# main app at "/". The /docs/ location uses `alias` to map the URL prefix to
# the build output directory.
# ════════════════════════════════════════════════════════════════════════

# gzip for text assets
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript
           application/json image/svg+xml application/xml;

# ---- / (main SPA client :3000) -------------------------------------------
location / {
    root /var/www/must-be-the-sql/sql-logic-client/dist;
    try_files $uri $uri/ /index.html;
}

# ---- /docs/ (this Docusaurus site) ---------------------------------------
location /docs/ {
    # alias (NOT root) so the /docs/ prefix is stripped before file lookup
    alias /var/www/must-be-the-sql/sql-logic-docs/build/;

    # SPA fallback. The fallback URI keeps the /docs/ prefix so Nginx
    # re-enters this location and aliases again to index.html.
    try_files $uri $uri/ /docs/index.html;

    # cache fingerprinted assets aggressively (Docusaurus hashes filenames)
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|webp|svg|ico)$ {
        alias /var/www/must-be-the-sql/sql-logic-docs/build/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML must not be cached aggressively or updates won't show
    location ~* \.html$ {
        alias /var/www/must-be-the-sql/sql-logic-docs/build/;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# Optional: proxy /api + /swagger to backend so an embedded Swagger iframe
# (docs/api/openapi-bridge) works on the same origin without CORS tweaks.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Optional: expose backend Swagger UI directly
location /swagger-ui/ {
    proxy_pass http://127.0.0.1:8080/swagger-ui/;
    proxy_set_header Host $host;
}

# ════════════════════════════════════════════════════════════════════════
# Deployment checklist (subpath mode)
#   1. cd sql-logic-docs && npm ci && npm run build   # produces build/ with /docs/ prefix
#   2. rsync build/ → /var/www/must-be-the-sql/sql-logic-docs/build/
#   3. nginx -t && nginx -s reload
#   4. Verify https://example.com/docs/ loads; check no /docs/docs/ double prefix.
#      And https://example.com/ serves the client SPA.
# ════════════════════════════════════════════════════════════════════════
